{
  "name": "Build APK",
  "on": {
    "push": {
      "branches": [
        "main",
        "master"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-java@v5",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "subosito/flutter-action@v2",
          "with": {
            "channel": "stable"
          }
        },
        {
          "name": "Siapkan proyek Android",
          "run": "flutter create --org com.hardsub --project-name hardsub_ocr --platforms=android .\nbash patch.sh\nflutter pub get"
        },
        {
          "name": "Build APK per jenis prosesor",
          "run": "flutter build apk --release --split-per-abi"
        },
        {
          "name": "Periksa APK",
          "shell": "bash",
          "continue-on-error": true,
          "run": "set -u\nBT=$(ls -d \"${ANDROID_SDK_ROOT:-$ANDROID_HOME}\"/build-tools/* | sort -V | tail -1)\nfor APK in build/app/outputs/flutter-apk/*.apk; do\n  echo \"=== $APK ===\"\n  ls -l \"$APK\"\n  unzip -tq \"$APK\"\n  \"$BT/apksigner\" verify --verbose --print-certs \"$APK\" | head -12\n  \"$BT/aapt2\" dump badging \"$APK\" | grep -E \"^package|sdkVersion|targetSdkVersion|native-code\" || true\n  sha256sum \"$APK\"\ndone"
        },
        {
          "name": "Buat rilis",
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "tag_name": "build-${{ github.run_number }}",
            "name": "Hardsub OCR build ${{ github.run_number }}",
            "body": "Pasang dulu app-arm64-v8a-release.apk. Jika gagal, coba app-armeabi-v7a-release.apk.",
            "files": "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk\nbuild/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          }
        }
      ]
    }
  }
}
