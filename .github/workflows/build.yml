{
  "name": "Build APK",
  "on": {
    "push": {
      "branches": [
        "main",
        "master"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-java@v5",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "uses": "subosito/flutter-action@v2",
          "with": {
            "channel": "stable"
          }
        },
        {
          "name": "Siapkan proyek Android",
          "run": "flutter create --org com.hardsub --project-name hardsub_ocr --platforms=android .\nbash patch.sh\nflutter pub get"
        },
        {
          "name": "Analisis kode (flutter analyze)",
          "continue-on-error": true,
          "run": "flutter analyze --no-fatal-infos --no-fatal-warnings lib test 2>&1 | tee analyze.log"
        },
        {
          "name": "Unit test (flutter test)",
          "continue-on-error": true,
          "run": "flutter test 2>&1 | tee test.log"
        },
        {
          "name": "Build APK",
          "run": "flutter build apk --release --split-per-abi"
        },
        {
          "name": "Periksa APK",
          "continue-on-error": true,
          "run": "ls -la build/app/outputs/flutter-apk/\nfor f in build/app/outputs/flutter-apk/*.apk; do echo \"== $f\"; unzip -tq \"$f\" | tail -1; sha256sum \"$f\"; done"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "HardsubOCR-apk",
            "path": "build/app/outputs/flutter-apk/*.apk"
          }
        },
        {
          "name": "Buat rilis",
          "uses": "softprops/action-gh-release@v2",
          "with": {
            "tag_name": "build-${{ github.run_number }}",
            "name": "Hardsub OCR build ${{ github.run_number }}",
            "files": "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk\nbuild/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          }
        }
      ]
    }
  }
}
